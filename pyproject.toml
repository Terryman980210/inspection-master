[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inspection-master"
version = "0.3.0"
description = "2D DXF inspection item master editor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ezdxf>=1.3,<2",
  "PySide6>=6.7,<7",
]

[project.scripts]
inspection-master = "inspection_master.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

